<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>koralp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <div class="composition">
        <p class="pos-left thin" onclick="openImage('berlin.JPG', 'berlin, germany', '2025')">the crown of spree</p>
        <p class="pos-right thin" onclick="openImage('almostvertical.JPG', 'istanbul, türkiye', '2026')">twin galata</p>
        <p class="pos-center thin" onclick="openImage('theamberterminal.jpg', 'prague, czechia', '2025')">the amber terminal</p>
        
        <p class="pos-indent-1 bold" onclick="openProject(['p4.jpg', 'p7.jpg'], 'the museum of nothing')">the museum of nothing</p>
    
        <p class="pos-indent-2 thin" onclick="openImage('urbanstilness.JPG', 'prague, czechia', '2025')">urban stilness</p>
        <p class="pos-left thin" onclick="openImage('somewhereintheapocalypse.JPG', 'seattle, united states', '2024')">somewhere in the apocalypse</p>
        <p class="pos-right thin" onclick="openImage('vividspiral.JPG', 'eskişehir, türkiye', '2024')">vivid spiral</p>
        <p class="pos-center thin" onclick="openImage('linearsilence.JPG', 'seattle, united states', '2024')">linear silence</p>

        <p class="pos-left-1 bold" onclick="openProject(['p4.jpg', 'p7.jpg'], 'the silent therapy')">the silent therapy</p>

        <p class="pos-indent-2 thin" onclick="openImage('urbanstilness.JPG', 'prague, czechia', '2025')">urban stilness</p>
        <p class="pos-left thin" onclick="openImage('somewhereintheapocalypse.JPG', 'seattle, united states', '2024')">somewhere in the apocalypse</p>


    </div>

    <div id="image-overlay" class="overlay" onclick="closeElement(event, 'image-overlay')"></div>

    <div class="dot-trigger" onclick="openPopup()"></div>

    <div id="contact-popup" class="overlay" onclick="closeElement(event, 'contact-popup')">
        <div class="popup-content">
            <h3>contact</h3>
            <p>koralp öztekin</p>
            <p><a href="mailto:koralpoz@gmail.com">koralpoz@gmail.com</a></p>
        </div>
    </div>

    <script>
        function openImage(imgSrc, location, date) {
            const overlay = document.getElementById('image-overlay');
            overlay.innerHTML = `
                <div class="image-wrapper">
                    <img src="${imgSrc}" id="expanded-img" alt="proje">
                    <div id="image-info"><i>${location} — ${date}</i></div>
                </div>
            `;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function openProject(images, title) {
            const overlay = document.getElementById('image-overlay');
            overlay.innerHTML = `
                <div class="project-gallery">
                    <div class="project-info"><h2>${title}</h2></div>
                    ${images.map(src => `<img src="${src}">`).join('')}
                </div>`;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function openPopup() {
            document.getElementById('contact-popup').style.display = 'flex';
        }

        function closeElement(event, elementId) {
            if (event.target.id === elementId || event.target.className === 'project-gallery' || event.target.className === 'image-wrapper') {
                const overlay = document.getElementById(elementId);
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto';
                overlay.innerHTML = '';
            }
        }
    </script>
</body>
</html>
